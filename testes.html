<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinEdu · testes das regras</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
  <style>
    /* Só desta página. Usa as variáveis do estilo.css. */
    .testes {
      max-width: var(--largura-licao);
      margin: 0 auto;
      padding: var(--espaco-gg) var(--espaco-g) var(--espaco-xgg);
    }

    .testes h1 {
      margin-bottom: var(--espaco-p);
      font-size: var(--tamanho-titulo-m);
    }

    .testes h2 {
      margin: var(--espaco-gg) 0 var(--espaco-m);
      font-size: var(--tamanho-titulo-p);
    }

    .testes-resumo {
      font-weight: 800;
      font-size: var(--tamanho-medio);
    }

    .testes-resumo--passou { color: var(--cor-acerto); }
    .testes-resumo--falhou { color: var(--cor-erro); }

    .testes-lista {
      display: flex;
      flex-direction: column;
      gap: var(--espaco-p);
    }

    .teste {
      padding: var(--espaco-m) var(--espaco-g);
      border: var(--borda) solid var(--cor-borda);
      border-radius: var(--raio-m);
      background: var(--cor-cartao);
    }

    .teste-situacao {
      margin-right: var(--espaco-p);
      font-weight: 800;
    }

    .teste--passou .teste-situacao { color: var(--cor-acerto); }
    .teste--falhou { border-color: var(--cor-erro); }
    .teste--falhou .teste-situacao { color: var(--cor-erro); }

    .teste-erro {
      margin-top: var(--espaco-pp);
      color: var(--cor-texto-secundario);
      font-size: var(--tamanho-pequeno);
    }
  </style>
</head>
<body>
  <main class="testes">
    <h1>Testes das regras do FinEdu</h1>
    <p class="testes-resumo" id="resumo">Rodando os testes...</p>
    <div id="resultados"></div>
  </main>

  <!-- O conteúdo, o armazenamento, as regras e os textos do telas.js: os testes não mexem na tela do app nem
       no que está salvo no aparelho (os do armazenamento.js usam uma gaveta de mentira) -->
  <script src="js/dados-licoes.js"></script>
  <script src="js/armazenamento.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/telas.js"></script>
  <script>
    // ============================================================
    // testes.html — Testes das regras do jogo (jogo.js) e de alguns
    // textos da interface (telas.js)
    // ============================================================
    // Abra este arquivo com dois cliques. Cada teste monta uma
    // situação, usa as funções do jogo.js (ou monta um pedaço de
    // HTML do telas.js numa caixa fora da página) e confere o
    // resultado. Se algum falhar, ele aparece em vermelho com o motivo.
    // ============================================================


    // ============================================================
    // 1. COMO OS TESTES FUNCIONAM
    // ============================================================

    const grupos = [];   // [{ nome, testes: [{ nome, funcao }] }]

    function grupo(nome) {
      grupos.push({ nome, testes: [] });
    }

    function teste(nome, funcao) {
      grupos[grupos.length - 1].testes.push({ nome, funcao });
    }

    // Lança um erro se o valor não for o esperado
    function confere(valor, esperado, oQue) {
      const obtido = JSON.stringify(valor);
      const certo = JSON.stringify(esperado);
      if (obtido !== certo) throw new Error(`${oQue}: esperava ${certo}, veio ${obtido}`);
    }

    function rodarTestes() {
      const lugar = document.getElementById('resultados');
      let total = 0;
      let passaram = 0;

      for (const { nome, testes } of grupos) {
        const titulo = document.createElement('h2');
        titulo.textContent = nome;
        const lista = document.createElement('ol');
        lista.className = 'testes-lista';

        for (const item of testes) {
          let erro = null;
          try {
            item.funcao();
          } catch (problema) {
            erro = problema;
          }
          total += 1;
          if (!erro) passaram += 1;

          const linha = document.createElement('li');
          linha.className = `teste teste--${erro ? 'falhou' : 'passou'}`;
          const situacao = document.createElement('span');
          situacao.className = 'teste-situacao';
          situacao.textContent = erro ? 'Falhou' : 'Passou';
          linha.append(situacao, item.nome);
          if (erro) {
            const motivo = document.createElement('p');
            motivo.className = 'teste-erro';
            motivo.textContent = erro.message;
            linha.append(motivo);
          }
          lista.append(linha);
        }
        lugar.append(titulo, lista);
      }

      const resumo = document.getElementById('resumo');
      const tudoCerto = passaram === total;
      resumo.textContent = tudoCerto
        ? `Passaram todos os ${total} testes.`
        : `Falharam ${total - passaram} de ${total} testes.`;
      resumo.className = `testes-resumo testes-resumo--${tudoCerto ? 'passou' : 'falhou'}`;
    }


    // ============================================================
    // 2. AJUDANTES
    // ============================================================

    // HOJE é um dia em que a missão do dia é a da calculadora: assim, nos
    // testes das regras das lições, a missão não entra no XP, e os números
    // continuam os do plano. A missão tem o grupo de testes dela.
    const HOJE = '2026-11-05';
    const AMANHA = '2026-11-06';
    const DIA_DA_APRESENTACAO = '2026-11-11';   // missão "Conclua 1 lição"
    const TRILHA = CONTEUDO.trilhas[0];
    const UNIDADE = TRILHA.unidades[0];
    const [LICAO_1, LICAO_2, LICAO_3, LICAO_4] = UNIDADE.licoes;

    function novoProgresso() {
      return criarProgressoInicial(HOJE);
    }

    function abrir(progresso, licao) {
      return iniciarLicao(progresso, licao);
    }

    // Faz a lição inteira acertando tudo e conclui
    function concluirAcertandoTudo(progresso, licao, hoje = HOJE) {
      const sessao = abrir(progresso, licao);
      jogar(progresso, sessao, () => true);
      return concluirLicao(progresso, sessao, hoje);
    }

    // Marca a certa (certo = true) ou uma errada e aperta "Verificar"
    function responder(progresso, sessao, certo) {
      const alternativas = questaoAtual(sessao).alternativas;
      const indice = alternativas.findIndex(alternativa => Boolean(alternativa.correta) === certo);
      marcarAlternativa(sessao, indice);
      return verificarResposta(progresso, sessao);
    }

    // Responde e aperta "Continuar". Devolve o que vem depois.
    function responderEContinuar(progresso, sessao, certo) {
      responder(progresso, sessao, certo);
      return avancarQuestao(progresso, sessao);
    }

    // Joga até a lição acabar ou as vidas acabarem. "acertar" recebe
    // a sessão e diz se o aluno acerta a vez atual.
    function jogar(progresso, sessao, acertar) {
      for (let vezes = 0; vezes < 100; vezes++) {
        const proximo = responderEContinuar(progresso, sessao, acertar(sessao));
        if (proximo !== 'proxima') return proximo;
      }
      throw new Error('A lição não terminou depois de 100 respostas');
    }

    // Acerta tudo, menos as questões nas posições da lista (0 a 4),
    // que ele erra só da primeira vez
    function errandoDePrimeira(posicoes) {
      return sessao => !(vezAtual(sessao).tipo === 'nova' && posicoes.includes(vezAtual(sessao).indice));
    }

    // Monta um pedaço de HTML do telas.js numa caixa fora da página
    function montar(html) {
      const caixa = document.createElement('div');
      caixa.innerHTML = html;
      return caixa;
    }

    // O texto de um pedaço montado, com os espaços juntos
    function textoDe(caixa) {
      return caixa.textContent.replace(/\s+/g, ' ').trim();
    }

    // Um aluno no meio da trilha: lições 1 e 2 feitas, 3 vidas, 35 moedas, 105 XP, 1 dia
    function alunoNoMeio() {
      const progresso = novoProgresso();
      progresso.licoesConcluidas = [LICAO_1.id, LICAO_2.id];
      Object.assign(progresso, { vidas: 3, moedas: 35, xp: 105, sequencia: 1 });
      return progresso;
    }

    // Uma gaveta de mentira, com os mesmos três comandos do localStorage. Os
    // testes do armazenamento.js usam ela, para não mexer no que está salvo
    // no aparelho.
    function gavetaDeMentira() {
      const guardado = new Map();
      return {
        getItem: chave => (guardado.has(chave) ? guardado.get(chave) : null),
        setItem: (chave, valor) => { guardado.set(chave, String(valor)); },
        removeItem: chave => { guardado.delete(chave); }
      };
    }

    // Troca as trilhas do CONTEUDO por outras (de mentira) enquanto a função
    // roda e devolve as de verdade no fim, mesmo se der erro. A constante
    // CONTEUDO continua a mesma: só a lista de trilhas dentro dela muda.
    function comTrilhas(trilhas, funcao) {
      const deVerdade = CONTEUDO.trilhas;
      CONTEUDO.trilhas = trilhas;
      try {
        return funcao();
      } finally {
        CONTEUDO.trilhas = deVerdade;
      }
    }


    // ============================================================
    // 3. OS TESTES
    // ============================================================

    grupo('Conteúdo');

    teste('O conteúdo inteiro (Unidades 1, 2 e 3 e Trilha 2) passa na conferência do dados-licoes.js', () => {
      confere(conferirConteudo(), [], 'problemas encontrados');
    });

    teste('Toda lição da Unidade 1 tem 5 questões, do fácil para o difícil', () => {
      for (const licao of UNIDADE.licoes) {
        const sessao = abrir(novoProgresso(), licao);
        confere(sessao.questoes.map(questao => questao.dificuldade),
          ['facil', 'facil', 'media', 'media', 'dificil'], licao.titulo);
      }
    });

    // Os ids ficam salvos no progresso do aluno: mudar um id depois que a
    // lição vai ao ar faz o aparelho "esquecer" que ela foi concluída
    teste('Unidades 2 e 3 e Trilha 2 (05/11): 4 lições cada, com os ids combinados e 5 questões do fácil para o difícil', () => {
      const novas = [TRILHA.unidades[1], TRILHA.unidades[2], CONTEUDO.trilhas[1].unidades[0]];
      confere(novas.map(unidade => [unidade.id, unidade.titulo, unidade.licoes.map(licao => licao.id)]), [
        ['ef-unidade-2', 'Dinheiro no mundo real', ['primeiro-salario', 'pix-e-golpes', 'cartao-de-credito', 'apostas-e-dinheiro-facil']],
        ['ef-unidade-3', 'Planejando o futuro', ['inflacao', 'juros-compostos', 'reserva-de-emergencia', 'metas-grandes']],
        ['inv-unidade-1', 'Começando a investir', ['poupar-ou-investir', 'renda-fixa', 'risco-retorno-liquidez', 'promessa-boa-demais']]
      ], 'unidades e lições, na ordem');
      for (const unidade of novas) {
        for (const licao of unidade.licoes) {
          const sessao = abrir(novoProgresso(), licao);
          confere(sessao.questoes.map(questao => questao.dificuldade),
            ['facil', 'facil', 'media', 'media', 'dificil'], licao.titulo);
        }
      }
      confere(CONTEUDO.trilhas.flatMap(licoesDaTrilha).filter(item => item.licao.emBreve).length, 0, 'lições "Em breve" que sobraram');
    });


    grupo('Lição e revisão');

    teste('Lição toda certa: termina depois das 5 questões', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      confere(sessao.fila.length, 5, 'questões na fila');
      confere(jogar(progresso, sessao, () => true), 'fim', 'o que vem depois da 5ª');
    });

    teste('A errada volta no fim, como revisão, e a lição não termina antes', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      const depois = [true, false, true, true, true].map(certo => responderEContinuar(progresso, sessao, certo));
      confere(depois, ['proxima', 'proxima', 'proxima', 'proxima', 'proxima'], 'depois de cada uma das 5');
      confere(vezAtual(sessao), { tipo: 'revisao', indice: 1 }, 'vez depois da 5ª');
      confere(responderEContinuar(progresso, sessao, true), 'fim', 'depois de acertar a revisão');
    });

    teste('Errar na revisão não tira vida, e a questão volta de novo', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      [false, true, true, true, true].forEach(certo => responderEContinuar(progresso, sessao, certo));
      confere(progresso.vidas, 4, 'vidas depois do erro na questão nova');
      const resultado = responder(progresso, sessao, false);
      confere([resultado.tipo, resultado.perdeuVida, progresso.vidas], ['revisao', false, 4], 'erro na revisão');
      confere(avancarQuestao(progresso, sessao), 'proxima', 'depois do erro na revisão');
      confere(vezAtual(sessao), { tipo: 'revisao', indice: 0 }, 'a mesma questão volta');
      confere(responderEContinuar(progresso, sessao, true), 'fim', 'depois de acertar');
    });

    teste('Erro em questão nova tira 1 vida na hora', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      const resultado = responder(progresso, sessao, false);
      confere([resultado.perdeuVida, progresso.vidas], [true, 4], 'vida perdida e vidas');
    });

    teste('Com 0 vidas a lição para e não avança', () => {
      const progresso = novoProgresso();
      progresso.vidas = 1;
      const sessao = abrir(progresso, LICAO_1);
      const resultado = responder(progresso, sessao, false);
      confere(resultado.acabaramAsVidas, true, 'acabaram as vidas');
      confere(avancarQuestao(progresso, sessao), 'sem-vidas', 'depois do Continuar');
      confere(vezAtual(sessao), { tipo: 'nova', indice: 0 }, 'a vez continua a mesma');
    });

    teste('Precisão conta só a primeira resposta (erra 2: 60%, mesmo acertando na revisão)', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      jogar(progresso, sessao, errandoDePrimeira([3, 4]));
      const resumo = concluirLicao(progresso, sessao, HOJE);
      confere(resumo.precisao, 60, 'precisão da lição');
      confere([progresso.respostasCertas, progresso.respostasDadas], [3, 5], 'respostas certas e dadas no Perfil');
      confere(precisaoGeral(progresso), 60, 'precisão do Perfil');
    });


    grupo('XP e moedas');

    teste('Lição perfeita: 50 XP e 15 moedas (10 + 5)', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      jogar(progresso, sessao, () => true);
      const resumo = concluirLicao(progresso, sessao, HOJE);
      confere([resumo.xp, resumo.moedas, resumo.perfeita], [50, 15, true], 'XP, moedas e perfeita');
      confere([progresso.xp, progresso.moedas], [50, 35], 'XP e moedas no progresso (20 da mesada + 15)');
    });

    teste('Revisão vale 5 XP por questão, uma vez só (erra 2: 30 + 10 = 40 XP, 10 moedas)', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      [true, true, true, false, false].forEach(certo => responderEContinuar(progresso, sessao, certo));
      responderEContinuar(progresso, sessao, false);   // erra a primeira revisão
      jogar(progresso, sessao, () => true);
      const resumo = concluirLicao(progresso, sessao, HOJE);
      confere([resumo.xp, resumo.moedas, resumo.perfeita], [40, 10, false], 'XP, moedas e perfeita');
    });

    teste('Moedas só da primeira vez que conclui a lição', () => {
      const progresso = novoProgresso();
      concluirAcertandoTudo(progresso, LICAO_1);
      concluirAcertandoTudo(progresso, LICAO_1);
      confere(progresso.moedas, 35, 'moedas depois de fazer a lição 1 duas vezes (20 da mesada + 15)');
    });

    teste('XP e moedas só entram no fim da lição', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      responderEContinuar(progresso, sessao, true);
      confere([progresso.xp, progresso.moedas], [0, 20], 'XP e moedas no meio da lição (só a mesada)');
    });


    grupo('Níveis');

    teste('Os 5 níveis começam em 0, 75, 175, 300 e 450 XP', () => {
      confere(NIVEIS.map(nivel => nivel.nome), ['Aprendiz', 'Poupador', 'Planejador', 'Estrategista', 'Investidor'], 'nomes');
      const tabela = [[0, 1], [74, 1], [75, 2], [174, 2], [175, 3], [299, 3], [300, 4], [449, 4], [450, 5], [2000, 5]];
      for (const [xp, numero] of tabela) confere(nivelDoXp(xp).numero, numero, `nível com ${xp} XP`);
    });

    teste('Quanto falta: com 105 XP, nível 2 (Poupador) e faltam 70 para o 3 (Planejador)', () => {
      confere(nivelDoXp(105), { numero: 2, nome: 'Poupador', proximo: { numero: 3, nome: 'Planejador', xp: 175 }, faltam: 70 }, '105 XP');
      const maximo = nivelDoXp(500);
      confere([maximo.numero, maximo.proximo, maximo.faltam], [5, null, 0], 'no nível mais alto');
    });

    teste('Fim da lição: avisa quando sobe de nível, e só nessa hora (o treino não vale XP)', () => {
      const progresso = novoProgresso();
      const primeira = concluirAcertandoTudo(progresso, LICAO_1);   // 50 XP
      confere([primeira.nivel.numero, primeira.subiuDeNivel], [1, false], 'lição 1');
      const segunda = concluirAcertandoTudo(progresso, LICAO_2);    // 105 XP
      confere([segunda.nivel.numero, segunda.nivel.nome, segunda.subiuDeNivel], [2, 'Poupador', true], 'lição 2');
      const treino = concluirAcertandoTudo(progresso, LICAO_2);     // treino: não vale XP
      confere([treino.treino, treino.nivel.numero, treino.subiuDeNivel], [true, 2, false], 'treino da lição 2');
    });

    teste('Baú: avisa quando os 20 XP dele fazem subir de nível', () => {
      const progresso = novoProgresso();
      progresso.licoesConcluidas = UNIDADE.licoes.map(licao => licao.id);
      progresso.xp = 160;
      const recompensa = abrirBau(progresso, UNIDADE);
      confere([progresso.xp, recompensa.nivel.numero, recompensa.subiuDeNivel], [180, 3, true], 'baú com 160 XP');

      const outro = novoProgresso();
      outro.licoesConcluidas = UNIDADE.licoes.map(licao => licao.id);
      outro.xp = 100;
      confere(abrirBau(outro, UNIDADE).subiuDeNivel, false, 'baú com 100 XP');
    });


    grupo('Sem vidas: recarga e treino');

    teste('Recarga: só com 0 vidas e pelo menos 20 moedas', () => {
      const progresso = novoProgresso();
      progresso.moedas = 20;
      progresso.vidas = 1;
      confere(podeRecarregar(progresso), false, 'com 1 vida');
      progresso.vidas = 0;
      progresso.moedas = 19;
      confere(recarregarVidas(progresso), false, 'com 19 moedas');
      confere([progresso.vidas, progresso.moedas], [0, 19], 'nada muda sem pagar');
      progresso.moedas = 25;
      confere(recarregarVidas(progresso), true, 'com 25 moedas');
      confere([progresso.vidas, progresso.moedas], [5, 5], 'vidas e moedas depois de pagar');
    });

    teste('Mesada de boas-vindas: todo aluno começa com 20 moedas, também depois de "Reiniciar progresso"', () => {
      confere(novoProgresso().moedas, 20, 'moedas no começo');
      confere(prepararProgresso(null, HOJE).moedas, 20, 'moedas depois de reiniciar');
    });

    teste('Errou as 5 da lição 1: sem lição para treinar, a mesada paga a recarga e a revisão leva ao fim', () => {
      const progresso = novoProgresso();
      const sessao = abrir(progresso, LICAO_1);
      confere(jogar(progresso, sessao, errandoDePrimeira([0, 1, 2, 3, 4])), 'sem-vidas', 'depois de errar as 5');
      confere(licaoParaTreinar(progresso), null, 'lição para treinar');
      confere(recarregarVidas(progresso), true, 'pagou com a mesada');
      confere(avancarQuestao(progresso, sessao), 'proxima', 'depois de pagar');
      confere(vezAtual(sessao).tipo, 'revisao', 'tipo da vez depois de pagar');
      confere(jogar(progresso, sessao, () => true), 'fim', 'fim da lição');
      const resumo = concluirLicao(progresso, sessao, HOJE);
      // 5 consertadas na revisão (25 XP) e 10 moedas por concluir
      confere([resumo.xp, resumo.moedas, progresso.vidas, progresso.moedas], [25, 10, 5, 10], 'XP, moedas ganhas, vidas e moedas');
    });

    teste('Recarga no meio da lição: as vidas voltam a 5 e a lição continua de onde parou', () => {
      const progresso = novoProgresso();
      concluirAcertandoTudo(progresso, LICAO_1);
      progresso.vidas = 1;
      progresso.moedas = 20;
      const sessao = abrir(progresso, LICAO_2);
      responderEContinuar(progresso, sessao, true);   // aquecimento
      confere(responderEContinuar(progresso, sessao, false), 'sem-vidas', 'depois de errar a 1ª questão nova');
      confere(recarregarVidas(progresso), true, 'pagou');
      confere(avancarQuestao(progresso, sessao), 'proxima', 'depois de pagar');
      confere(vezAtual(sessao), { tipo: 'nova', indice: 1 }, 'vez depois de pagar');
      confere(jogar(progresso, sessao, () => true), 'fim', 'fim da lição');
      const resumo = concluirLicao(progresso, sessao, HOJE);
      // 4 certas de primeira (40) + revisão (5) + aquecimento (5)
      confere([resumo.xp, resumo.moedas, progresso.vidas, progresso.moedas], [50, 10, 5, 10], 'XP, moedas ganhas, vidas e moedas');
    });

    teste('Refazer lição concluída é treino: errar não tira vida', () => {
      const progresso = novoProgresso();
      concluirAcertandoTudo(progresso, LICAO_1);
      const sessao = abrir(progresso, LICAO_1);
      confere(sessao.treino, true, 'é treino');
      const resultado = responder(progresso, sessao, false);
      confere([resultado.perdeuVida, progresso.vidas], [false, 5], 'erro no treino');
    });

    teste('Treino com 0 vidas: dá para fazer, e no fim as vidas voltam a 5', () => {
      const progresso = novoProgresso();

    // faz a Unidade 1 inteira, no mesmo "dia", e abre o baú. "respondidas"
    // conta todas as vezes que ele apertou "Verificar" (aquecimento, novas,
    // revisão e treino), para estimar o tempo da aula. "subidas" diz onde
    // ele subiu de nível.
    // No dia HOJE (missão da calculadora), as lições não cumprem a missão:
    // são os números do plano. Em 11/11, a missão "Conclua 1 lição" dá
    // 20 XP a mais a cada um (os últimos testes do grupo).
    function simularAluno(erraDePrimeira, pagaSePuder = true, dia = HOJE) {
      const progresso = criarProgressoInicial(dia);
      const vistas = new Set();
      const contagem = { compras: 0, treinos: 0, respondidas: 0 };
      const subidas = [];

      function acertar(sessao) {
        const questao = questaoAtual(sessao);
        const idLicao = vezAtual(sessao).tipo === 'aquecimento' ? questao.idLicao : sessao.licao.id;
        const chave = `${idLicao}:${questao.posicao}`;
        const jaViu = vistas.has(chave);
        vistas.add(chave);
        return jaViu || !erraDePrimeira.includes(questao.posicao);
      }

      UNIDADE.licoes.forEach((licao, i) => {
        for (let tentativa = 1; ; tentativa++) {
          if (tentativa > 10) throw new Error(`não passou da lição "${licao.titulo}"`);
          const sessao = abrir(progresso, licao);
          let proximo = jogar(progresso, sessao, acertar);
          while (proximo === 'sem-vidas' && pagaSePuder && recarregarVidas(progresso)) {
            contagem.compras += 1;
            proximo = avancarQuestao(progresso, sessao);
            if (proximo === 'proxima') proximo = jogar(progresso, sessao, acertar);
          }
          contagem.respondidas += sessao.respondidas;
          if (proximo === 'fim') {
            const resumo = concluirLicao(progresso, sessao, dia);
            if (resumo.subiuDeNivel) subidas.push(`lição ${i + 1}: nível ${resumo.nivel.numero}`);
            break;
          }
          const paraTreinar = licaoParaTreinar(progresso);
          if (!paraTreinar) throw new Error('ficou sem vidas e sem lição para treinar');
          const treino = abrir(progresso, paraTreinar);
          jogar(progresso, treino, acertar);
          contagem.respondidas += treino.respondidas;
          concluirLicao(progresso, treino, dia);
          contagem.treinos += 1;
        }
      });
      const bau = abrirBau(progresso, UNIDADE);
      if (bau.subiuDeNivel) subidas.push(`baú: nível ${bau.nivel.numero}`);
      return {
        vidas: progresso.vidas, moedas: progresso.moedas, xp: progresso.xp,
        nivel: nivelDoXp(progresso.xp).numero, ...contagem, subidas
      };
    }

        subidas: ['lição 2: nível 2', 'lição 4: nível 3'] }, 'fim da unidade');

    // Os números de uma cor do navegador: "rgb(27, 31, 60)" vira [27, 31, 60]
    // (com transparência, "rgba(...)", vem um quarto número)
    function numerosDaCor(cor) {
      return cor.match(/[\d.]+/g).map(Number);
    }

    // Contraste entre duas cores, do jeito que a regra de acessibilidade mede
    // (WCAG): de 1 (igual) a 21 (preto no branco)
    function contrasteEntre(corA, corB) {
      const luz = ([r, g, b]) => [r, g, b]
        .map(c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; })
        .reduce((soma, c, i) => soma + c * [0.2126, 0.7152, 0.0722][i], 0);
      const [claro, escuro] = [luz(numerosDaCor(corA)), luz(numerosDaCor(corB))].sort((a, b) => b - a);
      return (claro + 0.05) / (escuro + 0.05);
    }

    // O primeiro fundo sem transparência atrás de um elemento (nele ou num pai)
    function fundoAtras(elemento) {
      for (let no = elemento; no; no = no.parentElement) {
        const cor = getComputedStyle(no).backgroundColor;
        const numeros = numerosDaCor(cor);
        if (numeros.length === 3 || numeros[3] === 1) return cor;
      }
      return null;
    }

    // Contraste entre a cor do texto e o fundo atrás dele. O elemento precisa
    // estar na página, para o navegador calcular as cores.
    function contrasteDe(elemento) {
      return contrasteEntre(getComputedStyle(elemento).color, fundoAtras(elemento));
    }
