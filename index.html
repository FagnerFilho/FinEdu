<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121F25">
  <meta name="description" content="FinEdu: educação financeira em lições curtas, para os alunos do CETI Dom Severino.">
  <title>FinEdu</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

  <!-- ==========================================================
       ESTOJO DE ÍCONES
       Cada ícone é desenhado uma vez aqui (<symbol id="i-nome">)
       e reaproveitado no resto do app com <use href="#i-nome">.
       A cor vem do CSS (currentColor), nunca daqui.
       ========================================================== -->
  <svg class="estojo" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

    <!-- Estrela da logo: quatro pontas com o miolo vazado -->
    <symbol id="i-logo" viewBox="0 0 120 120">
      <path fill="currentColor" fill-rule="evenodd" d="M60 4C66 40 80 54 116 60C80 66 66 80 60 116C54 80 40 66 4 60C40 54 54 40 60 4ZM60 34C63 52 68 57 86 60C68 63 63 68 60 86C57 68 52 63 34 60C52 57 57 52 60 34Z"/>
    </symbol>

    <!-- Faísca: a mesma estrela, cheia (usada na comemoração) -->
    <symbol id="i-faisca" viewBox="0 0 120 120">
      <path fill="currentColor" d="M60 4C66 40 80 54 116 60C80 66 66 80 60 116C54 80 40 66 4 60C40 54 54 40 60 4Z"/>
    </symbol>

    <!-- Menu -->
    <symbol id="i-aprender" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>
      </g>
    </symbol>
    <symbol id="i-calculadora" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8"/>
        <path d="M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>
      </g>
    </symbol>
    <symbol id="i-guia" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 8h6"/>
      </g>
    </symbol>
    <symbol id="i-perfil" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
      </g>
    </symbol>

    <!-- Contadores -->
    <symbol id="i-sequencia" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.4-5 .1 1.6.8 2.7 1.8 3.2C11 8.5 11.3 5 12 2z"/>
    </symbol>
    <symbol id="i-xp" viewBox="0 0 24 24">
      <path fill="currentColor" d="M13 2L4 14h7l-1 8 9-12h-7z"/>
    </symbol>
    <symbol id="i-moeda" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>
      </g>
    </symbol>
    <symbol id="i-vida" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>
    </symbol>

    <!-- Nível: divisa (duas setas para cima) -->
    <symbol id="i-nivel" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 12l6-6 6 6"/><path d="M6 19l6-6 6 6"/>
      </g>
    </symbol>

    <!-- Trilha -->
    <symbol id="i-check" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="i-estrela-licao" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/>
    </symbol>
    <symbol id="i-cadeado" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>
      </g>
    </symbol>
    <symbol id="i-bau" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v9H3z"/><path d="M3 12h18"/><rect x="10" y="10.5" width="4" height="4" rx="1"/>
      </g>
    </symbol>
    <symbol id="i-bau-aberto" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13h18v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
        <path d="M4 10.5 5.6 5.4A2 2 0 0 1 7.5 4h9a2 2 0 0 1 1.9 1.4l1.6 5.1z"/>
        <path d="M12 13v3"/>
      </g>
    </symbol>

    <!-- Lição e avisos -->
    <symbol id="i-fechar" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
    </symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
      </g>
    </symbol>

    <!-- Perfil -->
    <symbol id="i-ajustes" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
      </g>
    </symbol>
    <symbol id="i-alvo" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>
      </g>
    </symbol>
    <symbol id="i-info" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
      </g>
    </symbol>
  </svg>


  <div class="app">

    <!-- ==========================================================
         MENU
         Tela em pé: barra embaixo. Tela deitada: coluna à esquerda.
         Quem decide é o estilo.css; o HTML é o mesmo.
         ========================================================== -->
    <nav class="menu" aria-label="Menu principal">
      <a class="menu-logo" href="#aprender" aria-label="FinEdu, ir para a trilha">
        <svg class="logo-estrela" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
        <span class="logo-texto" aria-hidden="true"><span class="logo-fin">Fin</span><span class="logo-edu">Edu</span></span>
      </a>
      <a class="menu-item" href="#aprender" data-tela="aprender">
        <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-aprender"></use></svg>
        <span>Aprender</span>
      </a>
      <a class="menu-item" href="#calculadora" data-tela="calculadora">
        <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-calculadora"></use></svg>
        <span>Calculadora</span>
      </a>
      <a class="menu-item" href="#guia" data-tela="guia">
        <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-guia"></use></svg>
        <span>Guia</span>
      </a>
      <a class="menu-item" href="#perfil" data-tela="perfil">
        <svg class="icone" aria-hidden="true" focusable="false"><use href="#i-perfil"></use></svg>
        <span>Perfil</span>
      </a>
    </nav>

    <!-- ==========================================================
         BARRA DE CIMA: logo e contadores
         ========================================================== -->
    <header class="topo">
      <a class="topo-logo" href="#aprender" aria-label="FinEdu, ir para a trilha">
        <svg class="logo-estrela" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
        <span class="logo-texto" aria-hidden="true"><span class="logo-fin">Fin</span><span class="logo-edu">Edu</span></span>
      </a>
      <div class="contadores" id="contadores-topo"></div>
    </header>

    <!-- ==========================================================
         TELAS: uma <section> para cada. Só uma aparece por vez
         (as outras ficam com o atributo hidden). O conteúdo de cada
         uma é montado pelo telas.js.
         ========================================================== -->
    <main class="principal" id="principal">
      <section class="tela" id="tela-aprender" hidden></section>
      <section class="tela" id="tela-calculadora" hidden></section>
      <section class="tela" id="tela-guia" hidden></section>
      <section class="tela" id="tela-perfil" hidden></section>
      <section class="tela tela--foco" id="tela-licao" hidden></section>
      <section class="tela tela--foco" id="tela-resultado" hidden></section>
      <section class="tela tela--foco" id="tela-bau" hidden></section>
      <section class="tela tela--foco" id="tela-sem-vidas" hidden></section>
    </main>

    <!-- ==========================================================
         COLUNA DA DIREITA (só aparece com a tela deitada e larga)
         ========================================================== -->
    <aside class="coluna-direita" aria-label="Seu resumo">
      <div class="contadores contadores--coluna" id="contadores-coluna"></div>
      <div id="dica-da-estrela"></div>
    </aside>
  </div>

  <!-- Aviso rápido que aparece e some sozinho -->
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <!-- Texto lido por leitores de tela (o feedback da resposta, por exemplo) -->
  <div class="visualmente-oculto" id="anuncio" aria-live="polite"></div>

  <!-- Só aparece se o dados-licoes.js tiver algo fora do padrão -->
  <div class="problemas" id="problemas" role="alert" hidden></div>

  <!-- ==========================================================
       SCRIPTS: a ordem importa. Cada arquivo usa os de cima.
       ========================================================== -->
  <script src="js/dados-licoes.js"></script>
  <script src="js/armazenamento.js"></script>
  <script src="js/jogo.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
